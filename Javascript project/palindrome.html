<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palindrome Checker</title>
  <style>
    body {
      margin: 0;
      font-family: "Comic Sans MS", cursive, sans-serif; /* friendlier font */
      background: #e6f7ff; /* light blue background */
      display: flex;
      justify-content: center;
      align-items: center; 
      min-height: 100vh;
    }
    .container {
      max-width: 350px;
      width: 100%;
      background: #ffffff;
      border: 2px solid #4da6ff;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 15px;
      color: #00509e;
      font-size: 24px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #4da6ff;
      font-size: 15px;
      margin-bottom: 12px;
      box-sizing: border-box;
      background: #f9fcff;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      background: #28a745; /* green button */
      color: white;
    }
    .btn:hover {
      background: #218838;
    }
    .result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      display: none;
    }
    .success {
      background: #d4f8d4; /* light green */
      border: 1px solid #2d7a2d;
      color: #145214;
    }
    .fail {
      background: #ffe0e0; /* soft red */
      border: 1px solid #cc0000;
      color: #660000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Palindrome Checker</h1>
    <input id="textInput" type="text" placeholder="Enter text here">
    <button class="btn" onclick="checkPalindrome()">Check</button>
    <div id="result" class="result"></div>
  </div>
  <script>
    function checkPalindrome() {
      const text = document.getElementById("textInput").value.toLowerCase().replace(/[^a-z0-9]/g, "");
      const resultBox = document.getElementById("result");
      if (!text) {
        resultBox.style.display = "none";
        return;
      }
      const isPalindrome = text === text.split("").reverse().join("");
      resultBox.style.display = "block";
      resultBox.className = "result " + (isPalindrome ? "success" : "fail");
      resultBox.textContent = isPalindrome ? "✅ It's a palindrome!" : "❌ Not a palindrome.";
    }
  </script>
</body>
</html>
