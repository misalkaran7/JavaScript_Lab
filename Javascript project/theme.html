<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Settings</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; transition: 0.3s; }
    body {
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Themes */
    body.light { background: #eceaff; color: #222; }
    body.dark { background: #1a1a2e; color: #fff; }
    body.pastel { background: #fcd1d1; color: #333; }
    body.ocean { background: #8ec5fc; color: #023e8a; }

    .box {
        background: rgba(255,255,255,0.9);
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        width: 320px;
    }

    h2 { margin-bottom: 20px; }

    .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
    button {
        padding: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #ddd;
        font-weight: bold;
    }
    button.active { background: #667eea; color: white; }

    .slider-row, .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 10px 0;
    }

    input[type="range"] { width: 150px; }

    .reset {
        margin-top: 20px;
        background: #667eea;
        color: white;
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
    }
</style>
</head>
<body>
<div class="box">
    <h2>⚙️ Theme Settings</h2>

    <div class="themes">
        <button data-theme="light" class="active">☀️ Light</button>
        <button data-theme="dark">🌙 Dark</button>
        <button data-theme="pastel"> Pastel</button>
        <button data-theme="ocean"> Ocean</button>
    </div>

    <div class="slider-row">
        <label>Font Size:</label>
        <input type="range" id="fontRange" min="12" max="24" value="16">
    </div>

    <div class="toggle-row">
        <label>Animations:</label>
        <input type="checkbox" id="animToggle" checked>
    </div>

    <div class="toggle-row">
        <label>Reduce Motion:</label>
        <input type="checkbox" id="motionToggle">
    </div>

    <button class="reset" id="resetBtn">Reset</button>
</div>

<script>
    const defaults = { theme: 'light', fontSize: 16, animations: true, reduceMotion: false };
    let settings = JSON.parse(localStorage.getItem('prefs')) || defaults;

    const applySettings = () => {
        document.body.className = settings.theme;
        document.body.style.fontSize = settings.fontSize + 'px';
        document.getElementById('fontRange').value = settings.fontSize;
        document.getElementById('animToggle').checked = settings.animations;
        document.getElementById('motionToggle').checked = settings.reduceMotion;

        document.querySelectorAll('button[data-theme]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === settings.theme);
        });

        if (!settings.animations) document.body.style.transition = 'none';
        else document.body.style.transition = '0.3s';

        if (settings.reduceMotion) document.querySelectorAll('*').forEach(el => el.style.animation = 'none');
    };

    const saveSettings = () => {
        localStorage.setItem('prefs', JSON.stringify(settings));
        applySettings();
    };

    document.querySelectorAll('button[data-theme]').forEach(btn => {
        btn.onclick = () => {
            settings.theme = btn.dataset.theme;
            saveSettings();
        };
    });

    document.getElementById('fontRange').oninput = e => {
        settings.fontSize = +e.target.value;
        saveSettings();
    };

    document.getElementById('animToggle').onchange = e => {
        settings.animations = e.target.checked;
        saveSettings();
    };

    document.getElementById('motionToggle').onchange = e => {
        settings.reduceMotion = e.target.checked;
        saveSettings();
    };

    document.getElementById('resetBtn').onclick = () => {
        settings = { ...defaults };
        saveSettings();
    };

    applySettings();
</script>
</body>
</html>
